---
layout: default
---

<article class="page-content">
  <h1>{{ page.title }}</h1>
  
  {{ content }}
</article>

<style>
  .page-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    line-height: 1.6;
    font-size: 16px;
  }

  .page-content h1 {
    font-size: 2.5em;
    margin-bottom: 0.5em;
    color: #333;
    border-bottom: 3px solid #157878;
    padding-bottom: 0.3em;
  }

  .page-content h2 {
    font-size: 1.8em;
    margin-top: 1.2em;
    margin-bottom: 0.5em;
    color: #333;
  }

  .page-content h3 {
    font-size: 1.3em;
    margin-top: 1em;
    margin-bottom: 0.3em;
    color: #555;
  }

  .page-content p {
    margin-bottom: 1em;
  }

  .page-content ul, .page-content ol {
    margin-bottom: 1em;
    padding-left: 2em;
  }

  .page-content li {
    margin-bottom: 0.5em;
  }

  .page-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
  }

  .page-content table th,
  .page-content table td {
    padding: 0.75em;
    border: 1px solid #ddd;
    text-align: left;
  }

  .page-content table th {
    background-color: #157878;
    color: white;
    font-weight: bold;
  }

  .page-content table tr:nth-child(even) {
    background-color: #f9f9f9;
  }

  .page-content blockquote {
    border-left: 4px solid #157878;
    padding-left: 1em;
    margin-left: 0;
    color: #666;
    font-style: italic;
  }

  .page-content strong {
    color: #333;
  }

  .page-content code {
    background-color: #f4f4f4;
    padding: 0.2em 0.4em;
    border-radius: 3px;
    font-family: monospace;
  }

  .page-content pre {
    background-color: #f4f4f4;
    padding: 1em;
    border-radius: 5px;
    overflow-x: auto;
  }

  .page-content pre code {
    background-color: transparent;
    padding: 0;
  }

  hr {
    border: none;
    border-top: 2px solid #e1e4e8;
    margin: 2em 0;
  }
</style>
